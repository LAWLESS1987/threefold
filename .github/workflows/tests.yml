name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: test dependencies (no torch, no lens)
        run: python -m pip install numpy pytest
      - name: L-lens and triad verification, each link broken on purpose
        run: python -m pytest -q tests/test_llens.py
      - name: auditability checks (self-test, retractions, claims index, manifest)
        run: python -I research_grade.py
